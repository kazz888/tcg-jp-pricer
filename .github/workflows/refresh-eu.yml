# Weekly European price refresh. THIS ONE COSTS MONEY.
#
# A full Cardmarket pull is 4,666 singles rows + 699 sealed rows through the
# Apify price-guide actor: ~$5.39 of credit, measured. Apify Starter includes
# $19/month, so:
#
#     nightly  ~30 runs  ~$162/month   <- would exhaust the allowance in 4 days
#     weekly     4 runs   ~$21.6/month <- marginally over
#     10-daily   3 runs   ~$16.2/month <- fits, and is the default here
#
# Cardmarket publishes the guide daily, but European prices for Japanese cards
# move slowly; a ten-day-old trend price is still a sound buy/no-buy signal.
# Use the manual trigger to force a fresh pull right before travelling.

name: Refresh European prices

on:
  schedule:
    # 1st, 11th and 21st at 03:00 UTC - three runs a month, inside the $19 credit.
    - cron: '0 3 1,11,21 * *'
  workflow_dispatch:
    inputs:
      include_sealed:
        description: 'Also refresh sealed (booster boxes and packs)'
        type: boolean
        default: true

concurrency:
  group: price-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail early and loudly rather than half-way through a paid pull.
      #
      # NB: never pipe `curl -sf` into a JSON parser. On any HTTP error -f emits
      # NOTHING, so the parser dies on empty input and the real cause (a 401, a
      # token with a pasted trailing newline) is invisible. Check the status code.
      - name: Check the Apify balance before spending
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          # Trailing whitespace from a pasted secret is the usual culprit, and it
          # turns into %0A in the query string. Strip it, then re-mask: the
          # trimmed value is no longer byte-identical to the registered secret,
          # so GitHub would not redact it on its own.
          TOKEN="$(printf '%s' "$APIFY_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "::error::APIFY_TOKEN is empty. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "token length: ${#TOKEN} (an Apify token is 46 chars and starts apify_api_)"

          CODE=$(curl -s -o /tmp/apify-me.json -w '%{http_code}' --max-time 30 \
            "https://api.apify.com/v2/users/me?token=$TOKEN")
          if [ "$CODE" != "200" ]; then
            echo "::error::Apify /users/me returned HTTP $CODE - the token is wrong, expired, or was pasted with extra characters."
            head -c 300 /tmp/apify-me.json || true
            exit 1
          fi

          node -e '
            const d = require("/tmp/apify-me.json").data ?? {};
            const p = d.plan ?? {};
            console.log(`user=${d.username} plan=${p.id} monthlyCreditUsd=${p.monthlyUsageCreditsUsd}`);
            if (p.id === "FREE") {
              console.log("::warning::Apify is on the FREE plan, which caps every actor run at 5 rows. The pull below will be refused as truncated.");
            }
          '

          # Hand the cleaned token to every later step, so a stray newline cannot
          # break the paid pull after we have already proved the token is good.
          echo "APIFY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Pull Cardmarket singles
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/pull-cardmarket.mjs --live --row-cap 100000 --max-items 5000 --max-runs 60

      - name: Pull Cardmarket sealed
        if: github.event_name == 'schedule' || inputs.include_sealed
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/pull-sealed.mjs

      # A truncated pull must never be published: partial Cardmarket data makes
      # real cards look unpriceable, which reads as "worthless" at a counter.
      - name: Refuse to publish a truncated pull
        run: |
          node -e '
            const d = require("./data/cardmarket.json");
            console.log(`rows=${d.rows?.length ?? 0} truncated=${d.truncated}`);
            if (d.truncated === true) throw new Error("pull is truncated - refusing to publish partial European prices");
            if ((d.rows?.length ?? 0) < 3000) throw new Error(`only ${d.rows?.length} rows - expected ~4,666`);
          '

      - name: Rebuild the index
        run: node scripts/build-index.mjs

      - run: pnpm test
      - run: pnpm check
      - run: pnpm build

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cardmarket.json data/sealed.json data/cardmarket-sealed-raw.json data/index.json
          if git diff --cached --quiet; then
            echo "No European price movement since the last run."
          else
            git commit -m "data: European price refresh (Cardmarket)"
            git pull --rebase --autostash origin main
            git push
          fi

      # Never fail the run over a cost report - the data is already published by
      # this point. Same status-code discipline as the check above, so a failure
      # here reads as a failure and not as a JSON parse error.
      - name: Report what this run cost
        if: always()
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "No token available - skipping the cost report."
            exit 0
          fi
          CODE=$(curl -s -o /tmp/apify-usage.json -w '%{http_code}' --max-time 30 \
            "https://api.apify.com/v2/users/me/usage/monthly?token=$APIFY_TOKEN") || CODE=000
          if [ "$CODE" != "200" ]; then
            echo "Usage endpoint returned HTTP $CODE - skipping the cost report."
            exit 0
          fi
          node -e '
            const u = require("/tmp/apify-usage.json").data ?? {};
            const spent = u.totalUsageCreditsUsdAfterVolumeDiscount ?? u.totalUsageCreditsUsd ?? 0;
            console.log(`Apify usage this billing cycle: $${Number(spent).toFixed(2)}`);
            const c = u.usageCycle ?? {};
            if (c.startAt) console.log(`cycle ${c.startAt.slice(0,10)} -> ${(c.endAt ?? "").slice(0,10)}`);
          ' || echo "could not parse the usage response"

      - name: Deploy to Cloudflare
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
